name: test

on:
  push:
  pull_request:

jobs:
  suite:
    # Portability that is claimed but not tested is not portability.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: test
        run: python -m pytest -q

  zipapp:
    # Catches most packaging mistakes: the archive builds and runs unprivileged.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target build/zipapp .
          python -m zipapp build/zipapp --main netcheck.cli:main --output netcheck.pyz
      - name: run doctor from the archive
        run: python netcheck.pyz doctor
