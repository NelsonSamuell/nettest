[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "l2check"
version = "0.1.0"
description = "Layer 2 and layer 3 network posture checker"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
netcheck = "l2check.cli:main"
l2check = "l2check.cli:main_l2check"

[tool.setuptools.packages.find]
include = ["l2check*"]

[tool.setuptools.package-data]
l2check = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
