[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "l2check"
version = "0.1.0"
description = "Layer 2 segmentation validator"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
l2check = "l2check.cli:main"

[tool.setuptools.packages.find]
include = ["l2check*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
