[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcheck"
version = "0.1.0"
description = "Layer 2 and layer 3 network posture validator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
netcheck = "netcheck.cli:main"

[tool.setuptools.packages.find]
include = ["netcheck*"]

[tool.setuptools.package-data]
"netcheck.cfg" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
